<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>小鲸 · 聊天</title><link rel="stylesheet" href="chat.css"></head>
<body class="bubble-mode"><main class="card">
  <header><span class="drag identity" title="拖动这里，调整与小鲸的距离"><strong id="companion-name">小鲸</strong><small id="view-label">桌面陪伴</small></span><button id="open-chat" class="bubble-only" title="展开聊天记录" aria-expanded="false">聊天记录</button><button id="switch-view" title="打开聊天面板">面板</button><button id="fold" title="收起聊天" aria-label="收起聊天">－</button></header>
  <p id="status" role="status">正在连接……</p>
  <div class="tools panel-only"><button id="share">共享应用 / 屏幕</button><button id="pause">暂停看</button><button id="stop">结束共享</button><button id="look">看一眼</button></div>
  <details id="chat-preferences" class="panel-only settings"><summary>声音与设置</summary><div class="settings-content"><label><input type="checkbox" id="voice">本机语音朗读</label><button id="settings">API 与声音设置</button><details><summary>保留一张定格</summary><input id="keep-note" maxlength="2000" placeholder="想留下这张图的原因" aria-label="保存画面的想法"><button id="keep">保存当前定格</button></details></div></details>
  <div id="last-message" class="bubble-only" tabindex="0" role="log" aria-label="当前这一轮回复，可滚动读完；之前的内容请打开聊天记录" aria-live="polite">想说什么，直接写在这里。</div>
  <div class="history-tools"><button id="history-sessions" aria-controls="session-browser" aria-expanded="false">历史会话</button><button id="history-current" hidden>返回当前</button><button id="older" hidden>查看更早记录</button></div>
  <div id="session-browser" hidden><div id="session-list"></div><button id="sessions-more" hidden>更多会话</button></div><p id="history-label" hidden></p>
  <div id="history" tabindex="0" aria-label="桌面聊天记录，可上下滚动"><p class="empty">想说什么，直接写在这里。</p></div>
  <button id="latest" hidden>有新消息 · 回到最新</button>
  <details id="unsent" name="delivery-view" class="delivery-panel unsent-panel"><summary>未发原话</summary><p class="delivery-hint">这里只列明确未作为聊天发送的原文，包括失败与检索过程。结果不明请到“发送回执”核对；查看不会补发。</p><button id="unsent-refresh" type="button">刷新未发原话</button><p id="unsent-status" role="status" aria-live="polite"></p><pre id="unsent-original" tabindex="0" aria-label="未发送的模型原文，仅供查看"></pre><div id="unsent-list"></div><button id="unsent-more" type="button" hidden>更早的未发原话</button></details>
  <details id="receipts" name="delivery-view" class="delivery-panel"><summary>发送回执</summary><p class="delivery-hint">查看每轮发送状态。本机聊天已保存不代表你已读；“待核对”不等于未发送。核对不会补发、朗读或执行动作。</p><button id="delivery-refresh" type="button">刷新发送回执</button><p id="delivery-status" role="status" aria-live="polite"></p><pre id="delivery-original" tabindex="0" aria-label="该回执对应的模型原文，仅供核对"></pre><div id="delivery-list"></div><button id="delivery-more" type="button" hidden>更早的发送回执</button></details>
  <form id="form"><textarea id="input" maxlength="4000" rows="2" aria-label="给小鲸的消息" placeholder="跟小鲸聊两句……"></textarea><div class="compose-footer"><small class="panel-only">Enter 发送 · Shift+Enter 换行</small><span id="input-count" class="panel-only">0 / 4000</span><button id="send" type="submit">发送</button></div></form>
  <footer class="panel-only">拖标题调距离 · 拖边角缩放</footer>
</main><div id="message-measure" aria-hidden="true"></div><script type="module" src="chat.js"></script></body></html>
