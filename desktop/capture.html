<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>DSH Friend · 一起看屏幕</title><link rel="stylesheet" href="settings.css"></head><body><main><span class="eyebrow">A SHARED MOMENT</span><h1>你想让它看哪里？</h1><p class="intro">只共享你选中的来源。不会收音，也不会操作电脑。</p><section><label>来源范围<select id="type"><option value="window">应用窗口</option><option value="screen">整块显示器</option></select></label><button id="refresh" type="button">刷新列表</button><div id="sources" class="sources" aria-label="可共享来源"></div><label class="check"><input id="consent" type="checkbox">允许把这个来源的画面发送给设置中的 API 服务商</label><label class="check danger" id="full-row" hidden><input id="full" type="checkbox">我确认共享整个显示器，包括切换应用后的可见内容</label><p class="hint">屏幕可能包含个人信息，请先关闭不想分享的内容。截图不会默认写到磁盘；聊天中的描述会保留在本机。</p><div class="bar"><button id="start" class="primary" type="button">开始共享</button><button id="stop" type="button">结束共享</button></div></section><video id="preview" autoplay muted playsinline aria-label="共享预览"></video><p id="status" role="status" aria-live="polite">正在读取来源……</p><p class="hint">暂停 / 继续：聊天面板或 Ctrl+Alt+F8。关闭本窗口会结束共享。</p></main><script type="module" src="capture.js"></script></body></html>
